[package]
name = "cc-bridge"
version = "0.1.0"
description = "CC Bridge: 常驻代理，把 Codex 模型接入 Claude Code"
authors = ["freecall"]
edition = "2024"

[lib]
name = "cc_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
claude-codex = { path = "../proxy" }
anyhow = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking", "socks"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
base64 = "0.22"
dirs = "6"
sysinfo = "0.37"
netstat2 = "0.11"
which = "8"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Registry",
] }
winreg = "0.55"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"
