[package]
name = "cc-bridge"
version = "0.1.0"
description = "CC Bridge: 常驻代理，把 Codex 模型接入 Claude Code"
authors = ["freecall"]
edition = "2024"

[lib]
name = "cc_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls", "rustls-tls-native-roots", "blocking", "http2", "socks"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net", "signal", "fs"] }
base64 = "0.22"
dirs = "6"
sysinfo = "0.37"
netstat2 = "0.11"
which = "8"
sys-locale = "0.3"

# ── 代理（src/proxy，源自 claude-code-with-codex v0.8.0，MIT）用到的依赖 ──
clap = { version = "4.5", features = ["derive", "env"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
async-trait = "0.1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
once_cell = "1.20"
regex-lite = "0.1"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
hyper-util = { version = "0.1", features = ["client-proxy"] }
url = "2"
ratatui = "0.29"
crossterm = "0.28"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
tiktoken-rs = { version = "0.12", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Registry",
] }
winreg = "0.55"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
