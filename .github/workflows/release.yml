# 推送 v* tag 时：Windows + macOS（Apple 芯片 / Intel 各一个包）并行打包 → 上传到同一个草稿 Release（含更新清单 latest.json）
# → 全部成功后正式发布。客户端的自动更新读的是 releases/latest/download/latest.json，所以只有正式发布后用户才会收到更新。
#
# 编译缓存：tag 触发的运行只能读取默认分支（master）的缓存，由 build-cache.yml 在 master 上预热；
# 这里共用同一个 shared-key 只读不写。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: false

      - run: npm ci

      - name: 按 tag 设置版本号
        shell: bash
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME}"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CC Bridge ${{ github.ref_name }}
          releaseBody: |
            ## 下载
            - Windows：`CC.Bridge_*_x64-setup.exe`（推荐）或 `.msi`
            - macOS Apple 芯片（M 系列）：`CC.Bridge_*_aarch64.dmg`
            - macOS Intel：`CC.Bridge_*_x64.dmg`

            macOS 包未签名，首次打开需在「系统设置 → 隐私与安全性」里点「仍要打开」。
            已安装的客户端会自动检测到这个版本，在主窗口点「立即更新」即可。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 正式发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
