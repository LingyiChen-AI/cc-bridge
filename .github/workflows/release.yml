# 推送 v* tag 时：三个平台打包 → 上传到同一个草稿 Release（含更新清单 latest.json）→ 全部成功后正式发布。
# 客户端的自动更新读的是 releases/latest/download/latest.json，所以只有正式发布后用户才会收到更新。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - run: npm ci

      - name: 按 tag 设置版本号
        shell: bash
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME}"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CC Bridge ${{ github.ref_name }}
          releaseBody: |
            ## 下载
            - Windows：`CC.Bridge_*_x64-setup.exe`（推荐）或 `.msi`
            - macOS：`CC.Bridge_*_universal.dmg`（未签名，首次打开需在「系统设置 → 隐私与安全性」里允许）
            - Linux：`.AppImage` / `.deb`

            已安装的客户端会自动检测到这个版本，在主窗口点「立即更新」即可。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 正式发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
