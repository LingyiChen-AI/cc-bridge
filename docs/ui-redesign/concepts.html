<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CC Bridge 界面方案</title>
<style>
/* ───────── 展示页外壳 ───────── */
:root {
  --page: #e9e7e4; --ink: #1c1917; --muted: #6b645c; --line: #d8d3cc; --brand: #d97757; --brand-d: #b4532f;
  --sans: 'Segoe UI Variable Text', 'Segoe UI', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --mono: 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 13px/1.5 var(--sans); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.shell { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }
.side { padding: 24px 20px; border-right: 1px solid var(--line); background: #f3f1ee; display: flex; flex-direction: column; gap: 18px; }
.side h1 { font-size: 17px; margin: 0; }
.side .lead { color: var(--muted); font-size: 12.5px; margin: 4px 0 0; }
.side h3 { font-size: 11px; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.pick { display: flex; flex-direction: column; gap: 6px; }
.pick button { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 12px; }
.pick button b { display: block; font-size: 13.5px; }
.pick button span { color: var(--muted); font-size: 12px; }
.pick button.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.seg { display: flex; background: #e4e0db; border-radius: 9px; padding: 3px; }
.seg button { flex: 1; border: 0; background: none; padding: 6px 0; border-radius: 7px; font-size: 12.5px; color: var(--muted); }
.seg button.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px #0002; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 10px; font-size: 12px; }
.chips button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.idea { font-size: 12.5px; color: #3f3a35; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.idea ul { margin: 6px 0 0; padding-left: 18px; }
.idea li { margin: 3px 0; }
.stage { display: flex; align-items: flex-start; justify-content: center; padding: 32px; overflow: auto; }

/* 窗口外框（Windows 风格） */
.win { width: 600px; height: 760px; background: #fff; border-radius: 10px; box-shadow: 0 30px 70px -20px #0005, 0 0 0 1px #0002; overflow: hidden; display: flex; flex-direction: column; position: relative; }
.titlebar { height: 32px; flex: none; display: flex; align-items: center; gap: 8px; padding-left: 12px; font-size: 12px; background: var(--tb, #f3f3f3); color: var(--tbt, #333); }
.titlebar svg { width: 16px; height: 16px; }
.titlebar .sp { flex: 1; }
.titlebar i { width: 46px; height: 32px; display: grid; place-items: center; font-style: normal; opacity: .7; }
.app { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }

svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; display: inline-block; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.08); } }
@keyframes slideIn { from { transform: translateX(24px); opacity: 0; } }
@keyframes sheetUp { from { transform: translateY(100%); } }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 60; background: #1c1917; color: #fff; padding: 8px 14px; border-radius: 999px; font-size: 12.5px; display: flex; gap: 8px; align-items: center; box-shadow: 0 10px 30px -10px #0008; animation: fadeUp .18s; white-space: nowrap; }

/* ═════════════ 方案 A：一键开关 ═════════════ */
.A { --bg: #f5f4f2; --card: #fff; --line: #ebe7e2; --t1: #1c1917; --t2: #615a52; --t3: #9a928a; --acc: #d97757; --acc-d: #b4532f; --ok: #2f9e5b; --warn: #d9822b; --err: #d64545; background: var(--bg); color: var(--t1); }
.A .hd { height: 56px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 20px; }
.A .hd b { font-size: 15px; }
.A .hd .sp { flex: 1; }
.A .pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px; border: 0; font-size: 12px; font-weight: 600; }
.A .pill.upd { background: #fdeee7; color: var(--acc-d); }
.A .body { flex: 1; overflow: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.A .body > *, .B .content > * { flex-shrink: 0; }
.A .card { background: var(--card); border-radius: 18px; padding: 16px; box-shadow: 0 1px 2px #0000000a; }
.A .hero { text-align: center; padding: 26px 20px 20px; }
.A .power { width: 120px; height: 120px; border-radius: 50%; border: 0; display: grid; place-items: center; margin: 0 auto; position: relative; transition: background .25s, box-shadow .25s; }
.A .power svg { width: 46px; height: 46px; stroke-width: 2.4; }
.A .power.on { background: radial-gradient(circle at 50% 35%, #3fbf73, #23894c); color: #fff; box-shadow: 0 0 0 10px #2f9e5b1f, 0 14px 30px -10px #23894c; }
.A .power.off { background: #efece8; color: #9a928a; box-shadow: inset 0 2px 6px #0000000f; }
.A .power.warn { background: radial-gradient(circle at 50% 35%, #f0a14a, #c9711f); color: #fff; box-shadow: 0 0 0 10px #d9822b22, 0 14px 30px -10px #c9711f; }
.A .power.busy::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--acc); animation: spin 1s linear infinite; }
.A .hero h2 { margin: 18px 0 4px; font-size: 19px; }
.A .hero p { margin: 0 auto; color: var(--t2); max-width: 400px; font-size: 13px; }
.A .hero p code { font-family: var(--mono); background: #f3efea; padding: 1px 6px; border-radius: 5px; font-size: 12px; }
.A .health { display: flex; justify-content: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.A .hchip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: #f6f3ef; font-size: 12px; color: var(--t2); border: 0; }
.A .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--t3); display: inline-block; flex: none; }
.A .dot.ok { background: var(--ok); } .A .dot.warn { background: var(--warn); animation: pulse 1.6s infinite; } .A .dot.err { background: var(--err); animation: pulse 1.6s infinite; }
.A .issue { display: flex; gap: 12px; align-items: flex-start; border-radius: 16px; padding: 14px 16px; background: #fff6ec; border: 1px solid #f6dcbc; animation: fadeUp .2s; }
.A .issue.err { background: #fff1f1; border-color: #f5cdcd; }
.A .issue svg { color: var(--warn); margin-top: 2px; }
.A .issue.err svg { color: var(--err); }
.A .issue b { display: block; }
.A .issue .d { color: var(--t2); font-size: 12.5px; }
.A .issue .acts { display: flex; gap: 8px; margin-top: 10px; }
.A .sec-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.A .sec-h b { font-size: 14px; }
.A .link { border: 0; background: none; color: var(--acc-d); font-weight: 600; font-size: 12.5px; display: inline-flex; align-items: center; gap: 2px; padding: 0; }
.A .mchips { display: flex; flex-wrap: wrap; gap: 8px; }
.A .mchip { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 7px 11px; font-family: var(--mono); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; transition: all .15s; }
.A .mchip.on { background: #1c1917; color: #fff; border-color: #1c1917; }
.A .mchip .new { font-family: var(--sans); font-size: 10.5px; background: var(--acc); color: #fff; border-radius: 4px; padding: 0 4px; }
.A .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.A .stat { background: #f8f6f3; border-radius: 12px; padding: 10px 12px; }
.A .stat .k { font-size: 11.5px; color: var(--t3); }
.A .stat .v { font-size: 18px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
.A .tabs { height: 64px; flex: none; display: grid; grid-template-columns: repeat(4, 1fr); background: #fff; border-top: 1px solid var(--line); }
.A .tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; color: var(--t3); position: relative; }
.A .tabs button svg { width: 20px; height: 20px; }
.A .tabs button.on { color: var(--t1); font-weight: 600; }
.A .tabs button.on svg { color: var(--acc); }
.A .tabs .badge { position: absolute; top: 10px; left: calc(50% + 6px); width: 8px; height: 8px; border-radius: 50%; background: var(--err); }
.A .btn { height: 34px; border-radius: 10px; border: 1px solid var(--line); background: #fff; padding: 0 14px; font-weight: 600; font-size: 12.5px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.A .btn.pri { background: var(--acc-d); border-color: var(--acc-d); color: #fff; }
.A .btn.dark { background: #1c1917; border-color: #1c1917; color: #fff; }
.A .btn.big { height: 46px; border-radius: 14px; font-size: 14.5px; width: 100%; }
.A .btn:disabled { opacity: .4; cursor: not-allowed; }
.A .search { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 12px; padding: 0 12px; height: 40px; border: 1px solid var(--line); }
.A .search input { border: 0; outline: 0; flex: 1; background: none; }
.A .quick { display: flex; gap: 6px; }
.A .quick button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 11px; font-size: 12px; }
.A .mtools { position: sticky; top: -4px; z-index: 5; background: var(--bg); margin: -4px -20px 0; padding: 4px 20px 10px; display: flex; flex-direction: column; gap: 10px; }
.A .grp { background: #fff; border-radius: 16px; overflow: hidden; }
.A .grp-h { cursor: pointer; user-select: none; }
.A .grp-h .gl { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--t2); }
.A .grp-h .gl svg { transition: transform .18s; }
.A .grp.closed .grp-h .gl svg { transform: rotate(-90deg); }
.A .grp-h .gr { display: inline-flex; align-items: center; gap: 10px; }
.A .grp-h .all { border: 0; background: none; color: var(--acc-d); font-size: 12px; font-weight: 600; padding: 0; }
.A .grp.closed .grp-h { background: #fff; }
.A .grp .cnt { font-variant-numeric: tabular-nums; }
.A .grp .cnt.has { color: var(--ok); font-weight: 600; }
.A .grp-h { display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; font-size: 12px; color: var(--t3); background: #faf8f6; }
.A .row { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-top: 1px solid #f2eee9; }
.A .row:first-child { border-top: 0; }
.A .row .name { flex: 1; font-family: var(--mono); font-size: 12.5px; }
.A .row .meta { color: var(--t3); font-size: 11.5px; }
.A .sw { width: 40px; height: 24px; border-radius: 999px; background: #ddd7d0; border: 0; position: relative; transition: background .18s; flex: none; padding: 0; }
.A .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px #0003; transition: transform .2s cubic-bezier(.3,1.4,.5,1); }
.A .sw.on { background: var(--ok); }
.A .sw.on::after { transform: translateX(16px); }
.A .feed { display: flex; flex-direction: column; gap: 8px; }
.A .req { background: #fff; border-radius: 14px; padding: 11px 14px; display: flex; gap: 10px; align-items: center; animation: fadeUp .2s; }
.A .req .route { font-size: 10.5px; padding: 1px 6px; border-radius: 5px; background: #eef6f0; color: #23894c; font-weight: 600; }
.A .req .route.cl { background: #fbeee8; color: var(--acc-d); }
.A .req .m { font-family: var(--mono); font-size: 12.5px; }
.A .req .sub { font-size: 11.5px; color: var(--t3); }
.A .req .st { margin-left: auto; text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }
.A .req.bad { box-shadow: inset 3px 0 0 var(--err); }
.A .req.bad .st { color: var(--err); }
.A .logs { background: #1c1917; color: #d6d0c8; border-radius: 14px; padding: 12px 14px; font: 11.5px/1.7 var(--mono); white-space: pre-wrap; word-break: break-all; min-height: 360px; user-select: text; }
.A .sgroup { background: #fff; border-radius: 16px; overflow: hidden; }
.A .sgroup-t { font-size: 12px; color: var(--t3); margin: 4px 4px 6px; }
.A .srow { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid #f2eee9; min-height: 52px; }
.A .srow:first-child { border-top: 0; }
.A .srow .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: #f6f1ec; color: var(--acc-d); flex: none; }
.A .srow .lb { flex: 1; min-width: 0; }
.A .srow .lb b { display: block; font-weight: 600; font-size: 13px; }
.A .srow .lb span { color: var(--t3); font-size: 11.5px; }
.A .srow input.v { border: 1px solid transparent; background: #f7f4f0; border-radius: 8px; height: 30px; padding: 0 9px; width: 190px; font-family: var(--mono); font-size: 12px; outline: none; }
.A .srow input.v:focus { border-color: var(--acc); background: #fff; }
.A .srow .res { font-size: 12px; display: inline-flex; gap: 4px; align-items: center; }
.A .res.ok { color: var(--ok); } .A .res.err { color: var(--err); }
.A .saved { font-size: 11.5px; color: var(--ok); display: inline-flex; align-items: center; gap: 4px; animation: fadeUp .2s; }
.A .upcard { background: linear-gradient(135deg, #fff4ee, #fff); border: 1px solid #f6dccf; border-radius: 16px; padding: 14px 16px; }
.A .bar { height: 6px; border-radius: 6px; background: #f1e6df; overflow: hidden; margin-top: 10px; }
.A .bar i { display: block; height: 100%; background: var(--acc); border-radius: 6px; transition: width .2s; }
.A .mask { position: absolute; inset: 0; background: #1c19174d; z-index: 40; animation: fadeUp .15s; }
.A .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 41; background: #fff; border-radius: 22px 22px 0 0; padding: 10px 22px 22px; animation: sheetUp .25s cubic-bezier(.2,.8,.3,1); box-shadow: 0 -10px 40px -10px #0004; }
.A .sheet .grab { width: 40px; height: 5px; border-radius: 5px; background: #e2ddd6; margin: 0 auto 14px; }
.A .sheet h3 { margin: 0; font-size: 18px; }
.A .sheet ul { margin: 10px 0 18px; padding-left: 18px; color: var(--t2); }
.A .sheet li { margin: 4px 0; }
/* A 引导 */
.A .ob { flex: 1; overflow: auto; padding: 34px 40px 28px; display: flex; flex-direction: column; }
.A .ob .logo-big { width: 64px; height: 64px; margin: 0 auto; display: block; }
.A .ob h1 { text-align: center; font-size: 24px; margin: 16px 0 4px; letter-spacing: -.3px; }
.A .ob .sub { text-align: center; color: var(--t2); margin: 0 0 24px; }
.A .chk { display: flex; gap: 12px; align-items: flex-start; padding: 13px 16px; border-top: 1px solid #f2eee9; }
.A .chk:first-child { border-top: 0; }
.A .chk .st { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; margin-top: 1px; }
.A .chk .st.ok { background: var(--ok); color: #fff; animation: pop .3s; }
.A .chk .st.fail { background: var(--err); color: #fff; animation: pop .3s; }
.A .chk .st.wait { border: 2px solid #e2ddd6; }
.A .chk .st.run { color: var(--acc); }
.A .chk .st svg { width: 13px; height: 13px; stroke-width: 3; }
.A .chk b { display: block; font-weight: 600; }
.A .chk .d { color: var(--t3); font-size: 12px; }
.A .chk .fix { margin-top: 8px; display: flex; gap: 8px; animation: fadeUp .2s; }
.A details.opt { margin-top: 12px; color: var(--t2); }
.A details.opt summary { cursor: pointer; font-size: 12.5px; list-style: none; display: inline-flex; gap: 4px; align-items: center; }
.A .ob .cta { margin-top: auto; padding-top: 18px; display: flex; flex-direction: column; gap: 8px; }
.A .ob .skip { border: 0; background: none; color: var(--t3); font-size: 12.5px; }
.A .done-ic { width: 76px; height: 76px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; margin: 10px auto 0; animation: pop .4s; }
.A .done-ic svg { width: 38px; height: 38px; stroke-width: 3; }
.A .term { background: #1c1917; border-radius: 14px; padding: 14px 16px; font: 12.5px/1.75 var(--mono); color: #d6d0c8; margin-top: 18px; }
.A .term .p { color: #8a837a; }
.A .term .hl { color: #f2a07f; }
.A .term .sel { background: #3a332c; color: #fff; border-radius: 4px; padding: 0 4px; margin: 0 -4px; }

/* ═════════════ 方案 B：工作台 ═════════════ */
.B { --bg: #fafafa; --card: #fff; --line: #ececec; --t1: #111; --t2: #555; --t3: #8e8e8e; --rail: #141414; --acc: #d97757; --acc-d: #b4532f; --ok: #16a34a; --warn: #d97706; --err: #dc2626; background: var(--bg); color: var(--t1); flex-direction: row !important; }
.B .rail { width: 148px; flex: none; background: var(--rail); color: #a3a3a3; display: flex; flex-direction: column; padding: 16px 10px 12px; gap: 2px; }
.B .rail .brand { display: flex; align-items: center; gap: 8px; color: #fff; font-weight: 650; font-size: 13.5px; padding: 0 6px 16px; }
.B .rail .brand svg { width: 22px; height: 22px; }
.B .nav { border: 0; background: none; color: inherit; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; font-size: 13px; text-align: left; position: relative; }
.B .nav:hover { background: #ffffff0d; color: #e5e5e5; }
.B .nav.on { background: #ffffff17; color: #fff; font-weight: 600; }
.B .nav .n { margin-left: auto; font-size: 11px; background: var(--err); color: #fff; border-radius: 999px; padding: 0 6px; }
.B .rail .sp { flex: 1; }
.B .rstat { border-radius: 10px; background: #ffffff0d; padding: 10px; font-size: 11.5px; line-height: 1.6; }
.B .rstat b { color: #fff; display: flex; align-items: center; gap: 6px; font-size: 12px; }
.B .rver { border: 0; background: none; color: #8a8a8a; font-size: 11.5px; padding: 8px 4px 0; text-align: left; display: flex; align-items: center; gap: 6px; }
.B .rver .up { color: #fff; background: var(--acc-d); border-radius: 999px; padding: 1px 7px; font-weight: 600; }
.B .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: #777; flex: none; }
.B .dot.ok { background: #22c55e; } .B .dot.warn { background: #f59e0b; animation: pulse 1.6s infinite; } .B .dot.err { background: #ef4444; animation: pulse 1.6s infinite; }
.B .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.B .ph { height: 54px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid var(--line); background: #fff; }
.B .ph h2 { font-size: 15px; margin: 0; }
.B .ph .sp { flex: 1; }
.B .content { flex: 1; overflow: auto; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 14px; position: relative; }
.B .tog { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--t2); }
.B .sw { width: 34px; height: 20px; border-radius: 999px; background: #d4d4d4; border: 0; position: relative; padding: 0; transition: background .15s; flex: none; }
.B .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .18s; box-shadow: 0 1px 2px #0003; }
.B .sw.on { background: #111; }
.B .sw.on::after { transform: translateX(14px); }
.B .banner { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1px solid; font-size: 12.5px; animation: fadeUp .2s; }
.B .banner.err { background: #fef2f2; border-color: #fbd5d5; }
.B .banner.err svg { color: var(--err); }
.B .banner.warn { background: #fffbeb; border-color: #fde7b0; }
.B .banner.warn svg { color: var(--warn); }
.B .banner.info { background: #fdf3ee; border-color: #f3d9cc; }
.B .banner.info svg { color: var(--acc-d); }
.B .banner .tx { flex: 1; min-width: 0; }
.B .banner b { font-weight: 600; }
.B .btn { height: 30px; border-radius: 7px; border: 1px solid var(--line); background: #fff; padding: 0 11px; font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }

    const v = s.dataset.v;
    if (s.dataset.s === 'concept') { S.concept = v; S.q = ''; S.drawer = null; S.cClosed = false; if (S.view === 'ob') startOb(); }
    if (s.dataset.s === 'view') { S.view = v; S.cClosed = false; if (v === 'ob') startOb(); else clearTimers(); }
    if (s.dataset.s === 'scen') applyScen(v);
    if (s.dataset.s === 'replay') startOb();
    return render();
  }
  if (S.concept === 'C' && !S.cClosed && e.target.closest('.desk') && !e.target.closest('.C') && !e.target.closest('.tray')) { S.cClosed = true; return render(); }
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const a = el.dataset.a, v = el.dataset.v, o = S.ob;
  switch (a) {
    case 'toast': toast(v); break;
    case 'fix': fixAction(v); break;
    case 'takeover': S.takeover = !S.takeover; toast(S.takeover ? '已接管，新开的 Claude Code 窗口生效' : '已恢复 Claude Code 原来的配置'); break;
    case 'model': toggleModel(v); break;
    case 'm-def': S.sel = new Set(DEFAULT_SEL); break;
    case 'm-all': S.sel = new Set(MODELS.map((m) => m.id)); break;
    case 'm-none': S.sel = new Set(); break;
    case 'm-fold': S.collapsed.has(v) ? S.collapsed.delete(v) : S.collapsed.add(v); break;
    case 'm-grp': { const ms = MODELS.filter((m) => m.fam === v).map((m) => m.id); const all = ms.every((id) => S.sel.has(id)); ms.forEach((id) => all ? S.sel.delete(id) : S.sel.add(id)); break; }
    case 'net': testNet(); break;
    case 'chk-upd': checkUpdate(); break;
    case 'autostart': S.cfg.autostart = !S.cfg.autostart; S.savedAt = Date.now(); later(1800, () => { S.savedAt = null; }); break;
    // A
    case 'a-tab': S.tabA = v; S.q = ''; break;
    case 'a-feed': S.feedA = v; break;
    case 'a-power':
      if (overall()[0] !== 'ok') { const x = issues()[0]; if (x) fixAction(x.acts[0][0]); }
      else { S.takeover = !S.takeover; toast(S.takeover ? '已接管 Claude Code' : '已恢复 Claude Code 原来的配置'); }
      break;
    case 'a-upd': S.aSheet = true; break;
    case 'a-sheet-close': if (S.upd === null) S.aSheet = false; break;
    case 'a-upd-go': S.aSheet = true; startUpdate(); break;
    // B
    case 'b-tab': S.tabB = v; S.q = ''; S.drawer = null; break;
    case 'b-filter': S.reqFilter = v; S.drawer = null; break;
    case 'b-row': S.tabB = 'reqs'; S.drawer = +v; break;
    case 'b-close': S.drawer = null; break;
    case 'b-raw': S.rawB = !S.rawB; S.drawer = null; break;
    case 'b-upd-go': startUpdate(); break;
    case 'd-auto': S.draft = { ...(S.draft || S.cfg), autostart: !(S.draft || S.cfg).autostart }; break;
    case 'd-reset': S.draft = null; break;
    case 'd-save': S.cfg = { ...S.draft }; S.draft = null; S.proxy = 'starting'; toast('已保存，正在重启代理', true); later(1100, () => { S.proxy = 'running'; toast('代理已重启'); }); break;
    // C
    case 'c-tray': S.cClosed = !S.cClosed; break;
    case 'c-focus': S.viewC = 'home'; S.q = ''; render(); document.getElementById('cmdq')?.focus(); return;
    case 'c-go-logs': S.viewC = 'logs'; S.q = ''; break;
    case 'c-go-settings': S.viewC = 'settings'; S.q = ''; break;
    case 'c-go-update': S.viewC = 'update'; S.q = ''; break;
    case 'c-back': if (S.upd === null) S.viewC = 'home'; break;
    case 'c-restart': S.q = ''; S.proxy = 'starting'; later(1000, () => { S.proxy = 'running'; toast('代理已重启'); }); break;
    case 'c-copy': S.q = ''; toast('已复制 6 行日志'); break;
    case 'c-chk': S.q = ''; checkUpdate(); later(1150, () => { if (S.update) S.viewC = 'update'; }); break;
    case 'c-upd-go': startUpdate(); break;
    // 引导
    case 'ob-fix': obFix(v); break;
    case 'ob-recheck': o.checks = { cli: 'wait', login: 'wait', net: 'wait', cfg: 'wait' }; runChecks(); break;
    case 'ob-auto': o.autostart = !o.autostart; break;
    case 'ob-take': o.takeover = !o.takeover; break;
    case 'ob-go': o.done = true; S.takeover = true; break;
    case 'ob-go-noto': o.done = true; S.takeover = false; break;
    case 'ob-finish': clearTimers(); S.view = 'main'; S.tabA = 'home'; S.tabB = 'overview'; S.viewC = 'home'; S.takeover = o.takeover; toast(o.takeover ? '已接管 Claude Code' : '代理已启动'); break;
    case 'ob-next': o.step++; o.test = null; break;
    case 'ob-back': o.step--; o.test = null; break;
    case 'ob-net': o.netChoice = v; o.test = null; break;
    case 'ob-test': o.test = 'run'; later(1000, () => { o.test = 'ok'; }); break;
    case 'ob-model': o.sel.has(v) ? o.sel.delete(v) : o.sel.add(v); S.sel = new Set(o.sel); break;
    case 'ob-ping': o.test = 'ping'; later(1400, () => { o.test = 'pong'; }); break;
    case 'ob-net-pick': o.netChoice = v; o.test = 'run'; later(900, () => { o.test = 'ok'; }); later(1500, () => { o.step = 2; o.test = null; }); break;
    case 'ob-take-pick': o.takeover = v === '1'; o.step = 3; break;
    case 'ob-auto-pick': o.autostart = v === '1'; o.done = true; break;
  }
  render();
});
document.addEventListener('input', (e) => {
  const k = e.target.dataset.in;
  if (!k) return;
  const v = e.target.value;
  if (k === 'q') { S.q = v; S.cur = 0; }
  else if (k.startsWith('d-')) { S.draft = { ...(S.draft || S.cfg), [k.slice(2)]: v }; }
  else if (k === 'ob-custom') { S.ob.netCustom = v; return; }
  else { S.cfg[k] = v; S.net = null; S.savedAt = Date.now(); later(1800, () => { S.savedAt = null; }); }
  render();
});
document.addEventListener('keydown', (e) => {
  if (S.concept !== 'C' || S.view !== 'main') return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); S.viewC = 'home'; S.cClosed = false; render(); document.getElementById('cmdq')?.focus(); return; }
  if (!S._items || document.activeElement?.id !== 'cmdq') return;
  if (e.key === 'ArrowDown') { S.cur = Math.min(S._items.length - 1, S.cur + 1); e.preventDefault(); render(); }
  if (e.key === 'ArrowUp') { S.cur = Math.max(0, S.cur - 1); e.preventDefault(); render(); }
  if (e.key === 'Enter') { const it = S._items[S.cur]; if (!it) return; if (it.k === 'm') { toggleModel(it.m.id); render(); } else { document.querySelector(`.C [data-a="${it.a[2]}"]`)?.click(); } }
  if (e.key === 'Escape') { S.q = ''; render(); }
});
// 截图 / 分享用：#A-main-update、#C-ob 这样的地址直接打开对应画面
(function () {
  const [c, v, sc, tab] = location.hash.slice(1).split('-');
  if (c && CONCEPTS[c]) S.concept = c;
  if (v === 'ob' || v === 'main') S.view = v;
  if (sc) applyScen(sc);
  if (tab) { S.tabA = tab; S.tabB = tab; S.viewC = tab; }
  if (S.view === 'ob') startOb();
})();
render();
</script>
